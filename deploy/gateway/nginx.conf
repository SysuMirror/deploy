# SSE Deploy 平台网关（用户模块 + 平台 SPA）
# PUBLIC_BASE_PATH=/sdpy 时：模块在 /sdpy/...，SPA 在 /sdpy/
# PUBLIC_BASE_PATH=/ 时：模块在 /test/... 与 /...，SPA 建议仍挂 /sdpy/ 或 /console/ 避免与模块冲突

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 200m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8088;
    server_name _;

    # 模块路由优先（api 生成）
    include /etc/nginx/modules.conf;

    # 平台管理站 SPA（构建时 VITE_BASE_PATH 需与此一致，默认仍建议 /sdpy/）
    location /sdpy/ {
      root /usr/share/nginx;
      try_files $uri $uri/ /sdpy/index.html;
      add_header Cache-Control "no-cache";
    }

    location = /sdpy {
      return 301 /sdpy/;
    }

    location /healthz {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}
