services:
  web:
    build:
      context: ./frontend
      args:
        # 同源访问：浏览器走前端域名下的 /api、/ws，由 nginx 反代到 api 服务
        VITE_API_URL: ""
        # 必须带平台路径前缀，否则 /assets/*.js 会打到站点根并返回 HTML（MIME 报错）
        VITE_BASE_PATH: ${SDPY_PUBLIC_BASE}/
    ports:
      - "${WEB_HOST_PORT}:80"
    depends_on:
      - api
    environment:
      SDPY_ENV: ${SDPY_ENV}
      SDPY_MODULE: ${SDPY_MODULE}

  api:
    build:
      context: ./backend
    ports:
      - "${API_HOST_PORT}:8002"
    environment:
      SDPY_ENV: ${SDPY_ENV}
      SDPY_MODULE: ${SDPY_MODULE}
      PORT: "8002"
      CORS_ORIGIN: ${SDPY_PUBLIC_URL:-*}
      DB_PATH: /data/novelwriter.db
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:-novelwriter-change-me-in-prod}
    volumes:
      # 平台会把 /root/SSE_Market/sse-sdpy/data/{模块名}/{test|prod} bind 到 /data
      - ${SDPY_DATA_DIR:-novelwriter-data}:/data

