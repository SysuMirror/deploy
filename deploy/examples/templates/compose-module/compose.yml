services:
  web:
    build: ./frontend
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    environment:
      - SDPY_ENV=${SDPY_ENV:-test}
      - SDPY_PUBLIC_BASE=${SDPY_PUBLIC_BASE:-/}
  api:
    build: ./backend
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - SDPY_ENV=${SDPY_ENV:-test}
      - SDPY_DATA_DIR=/data
    volumes:
      - ${SDPY_DATA_DIR:-./data}:/data
