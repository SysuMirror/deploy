<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDPY Sample</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
      }
      code {
        background: #1e293b;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
      }
      #status {
        margin-top: 1rem;
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SDPY Sample Frontend</h1>
      <p>API Base: <code id="api-base"></code></p>
      <p id="status">正在请求后端…</p>
    </main>
    <script>
      const API_BASE = '__VITE_API_BASE__';
      document.getElementById('api-base').textContent = API_BASE || '(empty)';
      fetch(API_BASE.replace(/\/$/, '') + '/health')
        .then((r) => r.json())
        .then((data) => {
          document.getElementById('status').textContent =
            '后端响应: ' + JSON.stringify(data);
        })
        .catch((e) => {
          document.getElementById('status').textContent = '后端请求失败: ' + e.message;
        });
    </script>
  </body>
</html>
